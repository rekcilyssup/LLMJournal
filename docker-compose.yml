version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm_journal_db
    environment:
      POSTGRES_DB: llm_journal
      POSTGRES_USER: journal_user
      POSTGRES_PASSWORD: journal_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal_user -d llm_journal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
