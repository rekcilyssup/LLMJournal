services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: journal_user
      POSTGRES_PASSWORD: journal_password_123
      POSTGRES_DB: llm_journal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal_user -d llm_journal"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql://journal_user:journal_password_123@db:5432/llm_journal
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
